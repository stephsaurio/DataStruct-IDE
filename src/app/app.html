<main class="app-container">
  <header class="app-header">
    <div>
      <h1>DataStruct IDE</h1>
      <p>Data Structures Programming Language</p>
    </div>

<button
  class="analyze-button"
  (click)="analyzeCode()">
  Analyze
</button>
  </header>

  <section class="workspace">
    <div class="editor-section">
      <app-code-editor></app-code-editor>
    </div>

    <aside class="errors-section">
      <app-error-panel></app-error-panel>
    </aside>
  </section>

  <section class="tokens-section">
    <app-token-table></app-token-table>
  </section>
</main>
