<main class="app-container">
  <header class="app-header">
    <div>
      <h1>DataStruct IDE</h1>
      <p>Data Structures Programming Language</p>
    </div>

    <button class="analyze-button" (click)="analyzeCode()">
      Analyze
    </button>
  </header>

  <section class="workspace">
    <div class="editor-section">
      <app-code-editor></app-code-editor>
    </div>

    <aside class="errors-section">
      <h2 class="errors-title">Analysis Errors</h2>

      <div class="error-panels">
        <app-error-panel
          [errors]="errors">
        </app-error-panel>

        <app-syntactic-error-panel
          [errors]="syntacticErrors">
        </app-syntactic-error-panel>
      </div>
    </aside>
  </section>

  <section class="tokens-section">
    <app-token-table [tokens]="tokens"></app-token-table>
  </section>
</main>
