<div class="error-panel">

  <h2>Lexical Errors</h2>

  @if (errors.length === 0) {

    <div class="empty-message">
      No lexical errors
    </div>

  } @else {

    <div class="error-list">

      @for (error of errors; track $index) {

        <div class="error-item">
          <strong>{{ error.message }}</strong>

          <span>
            Line {{ error.line }}, Column {{ error.column }}
          </span>
        </div>

      }

    </div>

  }

</div>
