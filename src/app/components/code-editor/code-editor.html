<div class="editor-container">

  <div class="editor-header">
    <h2>Code Editor</h2>

    <span class="line-counter">
      Lines: {{ lineCount }}
    </span>
  </div>

  <textarea
    class="code-area"
    [(ngModel)]="codeContent"
    placeholder="Write your code here..."
    spellcheck="false">
  </textarea>

</div>
